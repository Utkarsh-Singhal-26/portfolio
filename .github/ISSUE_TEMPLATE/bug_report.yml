name: Bug report
description: Something on the site is broken or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://utkarsh-singhal.is-a.dev/
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
