name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
      # No dependency needs an install script (sharp ships prebuilt binaries),
      # so skip them all to close the usual supply-chain entry point.
      - run: yarn install --frozen-lockfile --ignore-scripts
      # build generates next-env.d.ts (gitignored), which type-aware lint and type:check need
      - run: yarn build
      - run: yarn lint
      - run: yarn format:check
      - run: yarn type:check
