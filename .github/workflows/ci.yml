name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # build generates next-env.d.ts (gitignored), which type-aware lint and type:check need
      - run: yarn build
      - run: yarn lint
      - run: yarn format:check
      - run: yarn type:check
